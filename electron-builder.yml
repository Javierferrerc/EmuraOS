# electron-builder config — installers for the three OSes
# Usage (after `npm run package` on the same OS):
#   Windows: npm run make:installer        → NSIS .exe + latest.yml
#   macOS:   npm run make:installer:mac    → .dmg + .zip + latest-mac.yml
#   Linux:   npm run make:installer:linux  → .AppImage + .deb + latest-linux.yml

appId: com.emuraos.app
productName: EmuraOS
copyright: Copyright © 2026 Javier Ferrer

directories:
  output: out/installers

# Required by electron-updater: makes the build emit `latest.yml` + a
# `.blockmap` next to the installer, and embeds `app-update.yml` into the
# packaged resources so the running app knows where to look for updates.
# `publish: never` in CI means we upload the artifacts ourselves (see
# .github/workflows/release.yml) rather than letting electron-builder push.
publish:
  provider: github
  owner: Javierferrerc
  repo: EmuraOS

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # No spaces in the installer name. electron-updater's latest.yml records
  # the asset URL with spaces collapsed to dashes, but GitHub stores a
  # gh-uploaded "EmuraOS Setup x.exe" as "EmuraOS.Setup.x.exe" (dots) — the
  # mismatch would 404 the auto-update download. A dash-only name keeps the
  # file, its .blockmap, the latest.yml url, and the GitHub asset identical.
  artifactName: ${productName}-Setup-${version}.${ext}

# macOS. The zip target is REQUIRED for electron-updater (it updates from
# the zip, the dmg is only the human-facing installer). Until an Apple
# Developer ID certificate is provisioned the build ships unsigned
# (identity: null) — Gatekeeper users need right-click → Open on first
# launch, and in-app updates run in notify-only mode (see auto-updater.ts).
# When signing lands: set identity, enable hardenedRuntime + notarize.
mac:
  icon: assets/icon.icns
  category: public.app-category.games
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  icon: assets/icon.png
  category: Game
  maintainer: Javier Ferrer
  synopsis: Open-source retro gaming frontend
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EmuraOS
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerSidebar: assets/installer/installerSidebar.bmp
  uninstallerSidebar: assets/installer/installerSidebar.bmp
  installerHeader: assets/installer/installerHeader.bmp
  license: LICENSE
  # Per-user install. Two reasons:
  #   1. No UAC. The buggy v0.1.2/v0.1.3 auto-updater used child_process.spawn
  #      which can't trigger the UAC prompt — manifest-elevated installers
  #      hit it with EACCES. A per-user installer is asInvoker so spawn
  #      succeeds; users on broken versions can finally update.
  #   2. Going forward, auto-updates don't need admin even on locked-down
  #      machines (school computers, kiosks, etc.).
  perMachine: false
  menuCategory: EmuraOS
  include: build/installer.nsh
