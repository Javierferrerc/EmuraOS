name: Build & Upload Release

on:
  release:
    types: [published]

permissions:
  contents: write

# Phase 28 — one job per OS. Each job builds its own distributables and
# uploads them (plus its electron-updater metadata file) to the SAME GitHub
# release: latest.yml (win), latest-mac.yml, latest-linux.yml.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            installer: npx electron-builder --prepackaged out/emuraos-win32-x64 --win nsis --publish never
          - os: macos-latest
            installer: npx electron-builder --prepackaged out/emuraos-darwin-arm64 --mac --publish never
          - os: ubuntu-latest
            installer: npx electron-builder --prepackaged out/emuraos-linux-x64 --linux --publish never
    runs-on: ${{ matrix.os }}
    env:
      GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
      # Baked into the renderer bundle by Vite at `npm run make` time. Public by
      # design (security is enforced by RLS). Without these the packaged app
      # reports "social not configured" → users can't sign in / sign up.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests (exclude flaky GDrive download tests)
        run: npx vitest run --exclude tests/core/emulator-downloader.test.ts

      - name: Typecheck Electron main/preload
        run: npm run typecheck:electron

      - name: Build ZIP distributable (Electron Forge)
        run: npm run make

      - name: Build installer (electron-builder)
        run: ${{ matrix.installer }}

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name }}"
          # Forge ZIPs (path varies per OS/arch)
          for f in out/make/zip/*/*/*.zip; do
            [ -f "$f" ] && gh release upload "$tag" "$f" --clobber
          done
          # Installers + electron-updater metadata. The latest*.yml and
          # .blockmap files MUST be on the release: electron-updater reads
          # latest.yml / latest-mac.yml / latest-linux.yml to detect new
          # versions and the .blockmap to download only the changed bytes.
          for f in out/installers/*.exe out/installers/*.dmg \
                   out/installers/*.AppImage out/installers/*.deb \
                   out/installers/*.zip \
                   out/installers/latest*.yml out/installers/*.blockmap; do
            [ -f "$f" ] && gh release upload "$tag" "$f" --clobber
          done
